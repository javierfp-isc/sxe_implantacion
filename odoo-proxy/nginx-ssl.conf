upstream odoo_backend {
    server odoo-1:8069 max_fails=1 fail_timeout=5s;
    server odoo-2:8069 max_fails=1 fail_timeout=5s;
}

upstream odoo_bus {
    server odoo-1:8072 max_fails=1 fail_timeout=5s;
    server odoo-2:8072 max_fails=1 fail_timeout=5s;
}

server {
    listen 443 ssl;
    server_name odoo.localhost;

    ssl_certificate     /etc/nginx/certs/odoo.crt;
    ssl_certificate_key /etc/nginx/certs/odoo.key;

    location / {
        proxy_pass http://odoo_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Odoo-Backend $upstream_addr always;
    }

    location /websocket {
        proxy_pass http://odoo_bus;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
    }
}