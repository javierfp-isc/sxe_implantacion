#Hace balanceo round-robin entre los dos contenedores de Odoo
upstream odoo_backend {
    server odoo-1:8069;
    server odoo-2:8069;
}

#también balancea el bus de gevent para el longpolling.
upstream odoo_bus {
    server odoo-1:8072;
    server odoo-2:8072;
}

server {
    listen 80;
    server_name odoo.localhost;

    location / {
        proxy_pass http://odoo_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Odoo-Backend $upstream_addr always;
    }

    # Bus / gevent / longpolling
    location /websocket {
        proxy_pass http://odoo_bus;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
    }
}