services:
  odoo-1:
    image: odoo:19-auto     
    container_name: odoo-multi-1
    hostname: odoo
    command:
      - /bin/sh
      - -c
      - |
          chown -R odoo:odoo /opt/odoo/.local/share/Odoo
          /etc/init.d/odoo.sh start
          exec bash -c 'while true; do sleep 3600; done'
    volumes:
      - ~/odoo/src:/opt/odoo/src
      - odoo_data:/opt/odoo/.local/share/Odoo
    ports:
      - "8069:8069"
      - "8072:8072"
  odoo-2:
    image: odoo:19-auto     
    container_name: odoo-multi-2
    hostname: odoo
    command:
      - /bin/sh
      - -c
      - |
          chown -R odoo:odoo /opt/odoo/.local/share/Odoo
          /etc/init.d/odoo.sh start
          exec bash -c 'while true; do sleep 3600; done'
    volumes:
      - ~/odoo/src:/opt/odoo/src
      - odoo_data:/opt/odoo/.local/share/Odoo
    ports:
      - "8079:8069"
      - "8082:8072"
  postgres:
    image: odoo-postgres:17
    container_name: odoo-postgres-multi
    hostname: odoo-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: abc123.
    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  odoo_data: