[options]

; ============================================================
; CONFIGURACION GENERAL
; ============================================================

; Contraseña maestra para el gestor de bases de datos
admin_passwd = abc123.

; Directorio de datos:
; filestore, sesiones, etc.
data_dir = /opt/odoo/.local/share/Odoo

; Rutas de addons.
; Ajustar a la estructura real de tu instalación.
addons_path = /opt/odoo/src/OCB/addons

; Módulos cargados para todos los servidores/bases de datos
server_wide_modules = base,rpc,web

; Ruta de binarios adicionales
bin_path =

; Ruta de scripts de actualización
upgrade_path =

; Scripts previos a una actualización
pre_upgrade_scripts =


; ============================================================
; BASE DE DATOS
; ============================================================

; Base de datos concreta.
; Vacío = permitir seleccionar entre las disponibles.
db_name =

; Servidor PostgreSQL
db_host = postgres

; Puerto PostgreSQL
db_port = 5432

; Usuario PostgreSQL
db_user = odoo

; Contraseña PostgreSQL
db_password = abc123.

; SSL PostgreSQL:
; disable
; allow
; prefer
; require
; verify-ca
; verify-full
db_sslmode = prefer

; Nombre de aplicación visible en PostgreSQL.
; {pid} se sustituye por el PID.
db_app_name = odoo-{pid}

; Número máximo de conexiones físicas a PostgreSQL
db_maxconn = 64

; Máximo de conexiones para el worker gevent
; Dejar vacío/None para el valor por defecto.
db_maxconn_gevent = None

; Servidor PostgreSQL réplica
;db_replica_host =

; Puerto PostgreSQL réplica
;db_replica_port =

; Plantilla utilizada al crear nuevas bases de datos
db_template = template0

; Ejecutable de PostgreSQL
pg_path =


; ============================================================
; FILTRADO DE BASES DE DATOS
; ============================================================

; Expresión regular para limitar las bases de datos visibles.
;
; %h = hostname
; %d = dominio
;
; Ejemplos:
;
; dbfilter = ^odoo_prod$
; dbfilter = ^%h$
;
dbfilter =


; ============================================================
; HTTP
; ============================================================

; Interfaz donde escucha Odoo
http_interface = 0.0.0.0

; Puerto HTTP principal
http_port = 8069

; Puerto del worker gevent / WebSocket
gevent_port = 8072

; Activar HTTP
http_enable = True

; Odoo está detrás de un proxy inverso
;
; IMPORTANTE:
; Solo activar cuando existe un proxy de confianza
; delante de Odoo.
proxy_mode = True

; Permitir que Nginx sirva directamente archivos grandes
; mediante X-Accel-Redirect.
;
; Normalmente no es necesario.
x_sendfile = False


; ============================================================
; WEBSOCKET
; ============================================================

; Tiempo máximo de mantenimiento de una conexión WebSocket
websocket_keep_alive_timeout = 3600

; Número máximo de conexiones/eventos permitidos en ráfaga
websocket_rate_limit_burst = 10

; Retardo utilizado por el rate limiting WebSocket
websocket_rate_limit_delay = 0.2


; ============================================================
; SEGURIDAD / BASES DE DATOS
; ============================================================

; Mostrar listado de bases de datos
;
; En producción pública normalmente:
; list_db = False
;
list_db = True


; ============================================================
; MULTIPROCESO
; ============================================================

; Número de workers.
;
; 0 = modo threaded
;
; Para producción:
; workers = 2
;
workers = 2

; Máxima memoria virtual por worker antes de reiniciarlo
; 2048 MiB = 2147483648 bytes
limit_memory_soft = 2147483648

; Máxima memoria virtual permitida por worker
; 2560 MiB = 2684354560 bytes
limit_memory_hard = 2684354560

; Límite específico del worker gevent.
; None = utilizar limit_memory_soft
limit_memory_soft_gevent = None

; Límite hard específico del worker gevent.
; None = utilizar limit_memory_hard
limit_memory_hard_gevent = None

; Tiempo máximo de CPU por petición, en segundos
limit_time_cpu = 60

; Tiempo máximo real de una petición, en segundos
limit_time_real = 120

; Tiempo máximo real de un cron.
;
; -1 = utilizar limit_time_real
;  0 = sin límite
limit_time_real_cron = -1

; Número máximo de peticiones procesadas por worker
; antes de reiniciarlo.
limit_request = 65536


; ============================================================
; CRON
; ============================================================

; Número máximo de threads ejecutando cron simultáneamente
max_cron_threads = 2

; Tiempo máximo de vida de un worker/thread de cron
; 0 = desactivado
limit_time_worker_cron = 0


; ============================================================
; MODELOS TRANSIENT
; ============================================================

; Tiempo de permanencia de registros TransientModel,
; expresado en horas.
transient_age_limit = 1.0

; Límite de registros en tablas osv_memory.
; 0 = sin límite.
osv_memory_count_limit = 0


; ============================================================
; INTERNACIONALIZACIÓN
; ============================================================

; Idioma(s) a cargar
;
; load_language = es_ES
;
load_language =

; Sobrescribir traducciones existentes
;
; Normalmente se utiliza durante actualizaciones.
i18n_overwrite = False


; ============================================================
; SMTP
; ============================================================

; Dirección desde la que se envían correos
email_from =

; Filtro de dirección From
from_filter =

; Servidor SMTP
smtp = localhost

; Puerto SMTP
smtp_port = 25

; SMTP mediante SSL/STARTTLS
smtp_ssl = False

; Usuario SMTP
smtp_user =

; Contraseña SMTP
smtp_password =

; Certificado SSL SMTP
smtp_ssl_certificate_filename =

; Clave privada SSL SMTP
smtp_ssl_private_key_filename =


; ============================================================
; LOGGING
; ============================================================

; Fichero de log
;
; Vacío = salida estándar
logfile = /opt/odoo/odoo.log

; Utilizar syslog
syslog = False

; Nivel general
;
; info
; debug
; warn
; error
; critical
; etc.
log_level = info

; Handlers de logging
;
; Ejemplos:
;
; :INFO
; odoo.orm:DEBUG
; odoo.http:DEBUG
; odoo.sql_db:DEBUG
; werkzeug:CRITICAL
;
log_handler = :INFO

; Base de datos utilizada para logging
;log_db =

; Nivel de logging de base de datos
;log_db_level = warning

; Configuración avanzada de logging mediante JSON
log_config =


; ============================================================
; IMPORTACION
; ============================================================

; Separador interno de CSV
csv_internal_sep = ,

; Tamaño máximo de archivos importados
; 10 MiB
import_file_maxbytes = 10485760

; Timeout para importación desde URL
import_file_timeout = 3

; URLs permitidas para importación
import_url_regex = ^(?:http|https)://


; ============================================================
; PRODUCTIVIDAD
; ============================================================

; Activar aplicaciones de productividad por defecto
default_productivity_apps = False


; ============================================================
; GEOIP
; ============================================================

; Base de datos GeoIP City
geoip_city_db = /usr/share/GeoIP/GeoLite2-City.mmdb

; Base de datos GeoIP Country
geoip_country_db = /usr/share/GeoIP/GeoLite2-Country.mmdb


; ============================================================
; UNACCENT
; ============================================================

; Intentar activar la extensión PostgreSQL unaccent
; al crear nuevas bases de datos.
unaccent = False


; ============================================================
; DESARROLLO
; ============================================================

; Funciones de desarrollo:
;
; access
; qweb
; reload
; replica
; werkzeug
; xml
;
; También:
;
; dev_mode = all
;
; NO utilizar en producción.
dev_mode =


; ============================================================
; TESTING
; ============================================================

; Archivo de test Python
test_file =

; Activar tests
test_enable = False

; Tags de tests
test_tags =

; Directorio de screencasts
screencasts =

; Directorio de screenshots
screenshots = /tmp/odoo_tests


; ============================================================
; OTROS
; ============================================================

; Token utilizado para determinadas operaciones internas
proxy_access_token =

; URL de publisher warranty
publisher_warranty_url = http://services.odoo.com/publisher-warranty/

; Generar informes comprimidos
reportgz = False
