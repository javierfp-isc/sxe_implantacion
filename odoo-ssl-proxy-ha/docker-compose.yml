services:

  # ==========================================================
  # ODOO 1 - INSTANCIA 1
  # ==========================================================

  odoo-1-1:
    image: odoo:19-auto
    container_name: odoo-1-1
    hostname: odoo-1-1

    command:
      - /bin/sh
      - -c
      - |
        chown -R odoo:odoo /opt/odoo/.local/share/Odoo
        /etc/init.d/odoo.sh start
        exec bash -c 'while true; do sleep 3600; done'

    volumes:
      - ~/odoo/src:/opt/odoo/src
      - ./odoo1.conf:/opt/odoo/odoo.conf:ro
      - odoo_data-1:/opt/odoo/.local/share/Odoo

    depends_on:
      - postgres


  # ==========================================================
  # ODOO 1 - INSTANCIA 2
  # ==========================================================

  odoo-1-2:
    image: odoo:19-auto
    container_name: odoo-1-2
    hostname: odoo-1-2

    command:
      - /bin/sh
      - -c
      - |
        chown -R odoo:odoo /opt/odoo/.local/share/Odoo
        /etc/init.d/odoo.sh start
        exec bash -c 'while true; do sleep 3600; done'

    volumes:
      - ~/odoo/src:/opt/odoo/src
      - ./odoo1.conf:/opt/odoo/odoo.conf:ro
      - odoo_data-1:/opt/odoo/.local/share/Odoo

    depends_on:
      - postgres


  # ==========================================================
  # ODOO 2 - INSTANCIA 1
  # ==========================================================

  odoo-2-1:
    image: odoo:19-auto
    container_name: odoo-2-1
    hostname: odoo-2-1

    command:
      - /bin/sh
      - -c
      - |
        chown -R odoo:odoo /opt/odoo/.local/share/Odoo
        /etc/init.d/odoo.sh start
        exec bash -c 'while true; do sleep 3600; done'

    volumes:
      - ~/odoo/src:/opt/odoo/src
      - ./odoo2.conf:/opt/odoo/odoo.conf:ro
      - odoo_data-2:/opt/odoo/.local/share/Odoo

    depends_on:
      - postgres


  # ==========================================================
  # ODOO 2 - INSTANCIA 2
  # ==========================================================

  odoo-2-2:
    image: odoo:19-auto
    container_name: odoo-2-2
    hostname: odoo-2-2

    command:
      - /bin/sh
      - -c
      - |
        chown -R odoo:odoo /opt/odoo/.local/share/Odoo
        /etc/init.d/odoo.sh start
        exec bash -c 'while true; do sleep 3600; done'

    volumes:
      - ~/odoo/src:/opt/odoo/src
      - ./odoo2.conf:/opt/odoo/odoo.conf:ro
      - odoo_data-2:/opt/odoo/.local/share/Odoo

    depends_on:
      - postgres


  # ==========================================================
  # NGINX SSL / REVERSE PROXY
  # ==========================================================

  nginx-ssl:
    image: nginx:alpine
    container_name: odoo-ssl-nginx-proxy-ha

    ports:
      - "8443:443"

    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      - odoo-1-1
      - odoo-1-2
      - odoo-2-1
      - odoo-2-2


  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: odoo-postgres:17
    container_name: odoo-ssl-postgres-proxy-ha
    hostname: odoo-postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: abc123.

    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data:

  # Compartido por las dos instancias de Odoo 1
  odoo_data-1:

  # Compartido por las dos instancias de Odoo 2
  odoo_data-2: