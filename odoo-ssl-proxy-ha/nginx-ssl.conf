    listen 443 ssl;
    server_name odoo2.localhost;

    ssl_certificate     /etc/nginx/certs/odoo2.crt;
    ssl_certificate_key /etc/nginx/certs/odoo2.key;


    # --------------------------------------------------------
    # HTTP PRINCIPAL DE ODOO
    # --------------------------------------------------------

    location / {
        proxy_pass http://odoo2_backend;

