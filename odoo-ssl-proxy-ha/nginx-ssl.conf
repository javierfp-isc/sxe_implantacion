# ============================================================
# ODOO 1 - BACKENDS HTTP
# ============================================================

upstream odoo1_backend {
    server odoo-1-1:8069 max_fails=1 fail_timeout=5s;
    server odoo-1-2:8069 max_fails=1 fail_timeout=5s;
}


# ============================================================
# ODOO 1 - BUS / WEBSOCKET
# ============================================================

upstream odoo1_bus {
    server odoo-1-1:8072 max_fails=1 fail_timeout=5s;
    server odoo-1-2:8072 max_fails=1 fail_timeout=5s;
}


# ============================================================
# ODOO 2 - BACKENDS HTTP
# ============================================================

upstream odoo2_backend {
    server odoo-2-1:8069 max_fails=1 fail_timeout=5s;
    server odoo-2-2:8069 max_fails=1 fail_timeout=5s;
}


# ============================================================
# ODOO 2 - BUS / WEBSOCKET
# ============================================================

upstream odoo2_bus {
    server odoo-2-1:8072 max_fails=1 fail_timeout=5s;
    server odoo-2-2:8072 max_fails=1 fail_timeout=5s;
}


# ============================================================
# ODOO 1
# ============================================================

server {
    listen 443 ssl;
    server_name odoo1.localhost;

    ssl_certificate     /etc/nginx/certs/odoo1.crt;
    ssl_certificate_key /etc/nginx/certs/odoo1.key;


    # --------------------------------------------------------
    # HTTP PRINCIPAL DE ODOO
    # --------------------------------------------------------

    location / {
        proxy_pass http://odoo1_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_send_timeout 720s;
        proxy_read_timeout 720s;

        add_header X-Odoo-Backend $upstream_addr always;
    }


    # --------------------------------------------------------
    # WEBSOCKET / LONGPOLLING / BUS
    # --------------------------------------------------------

    location /websocket {
        proxy_pass http://odoo1_bus;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
    }
}


# ============================================================
# ODOO 2
# ============================================================

