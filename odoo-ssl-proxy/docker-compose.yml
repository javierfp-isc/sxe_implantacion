services:
  odoo-1:
    image: odoo:19-auto     
    container_name: odoo-ssl-proxy-1
    hostname: odoo-1
    command:
      - /bin/sh
      - -c
      - |
          chown -R odoo:odoo /opt/odoo/.local/share/Odoo
          /etc/init.d/odoo.sh start
          exec bash -c 'while true; do sleep 3600; done'
    volumes:
      - ~/odoo/src:/opt/odoo/src
      - odoo_data-1:/opt/odoo/.local/share/Odoo

  odoo-2:
    image: odoo:19-auto     
    container_name: odoo-ssl-proxy-2
    hostname: odoo-2
    command:
      - /bin/sh
      - -c
      - |
          chown -R odoo:odoo /opt/odoo/.local/share/Odoo
          /etc/init.d/odoo.sh start
          exec bash -c 'while true; do sleep 3600; done'
    volumes:
      - ~/odoo/src:/opt/odoo/src
      - odoo_data-2:/opt/odoo/.local/share/Odoo


  nginx-ssl:
    image: nginx:alpine
    container_name: odoo-ssl-nginx-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - odoo-1
      - odoo-2
  postgres:
    image: odoo-postgres:17
    container_name: odoo-ssl-postgres-proxy
    hostname: odoo-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: abc123.
    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  odoo_data-1:
  odoo_data-2: